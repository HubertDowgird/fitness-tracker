<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness">
<meta name="theme-color" content="#0c0f12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Fitness Tracker</title>
<style>
:root{--bg:#0c0f12;--card:#151a1f;--field:#0f1317;--line:#252c34;--txt:#eef1f4;--mut:#8b96a3;--acc:#5fd3a6;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
#app{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}
h1{font-size:28px;letter-spacing:-.02em;margin:0;font-weight:700}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
.pill{font-size:13px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap;margin-top:4px}
.pill.ok{color:var(--acc);border-color:rgba(95,211,166,.45);background:rgba(95,211,166,.08)}
.dn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.dn button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:12px;font:inherit}
.dn button:disabled{opacity:.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:15px;font-weight:600;color:var(--mut);margin:0 0 8px}
.row{display:flex;align-items:center;gap:12px;padding:5px 0}
.row label{flex:1;color:var(--txt);font-size:16px}
.f{display:flex;align-items:center;gap:8px}
.f input{width:112px;background:var(--field);border:1px solid var(--line);border-radius:12px;color:var(--txt);font:inherit;font-size:18px;font-weight:600;padding:9px 12px;text-align:right;outline:none}
.f input:focus,textarea:focus{border-color:var(--acc)}
.u{color:var(--mut);font-size:14px;width:32px}
.big{text-align:center;padding:20px 16px}
.big .f{justify-content:center}
.big .f input{width:190px;font-size:44px;font-weight:700;padding:8px 12px;letter-spacing:-.02em}
.big .u{font-size:18px;width:auto}
textarea{width:100%;min-height:84px;background:var(--field);border:1px solid var(--line);border-radius:12px;color:var(--txt);font:inherit;padding:10px 12px;resize:vertical;outline:none}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-size:17px;font-weight:600;background:var(--acc);color:#05150e;margin-top:6px}
.btn:active{opacity:.85}
.btn.s{background:transparent;color:var(--mut);border:1px solid var(--line);margin-top:10px}
.day{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;color:var(--txt);font:inherit}
.day b{display:block;font-weight:600}
.day span.m{color:var(--mut);font-size:14px}
.hint{color:var(--mut);font-size:14px;margin:14px 4px}
details.card summary{cursor:pointer;color:var(--mut)}
details.card[open] summary{margin-bottom:10px}
nav{flex:none;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:max(0px, calc(env(safe-area-inset-bottom,0px) - 8px))}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}
#sheet.show{display:flex}
.box{background:var(--card);width:100%;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
.box h3{margin:0;font-size:19px}
pre{white-space:pre-wrap;word-break:break-word;font:13px/1.55 ui-monospace,Menlo,monospace;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--acc);color:#05150e;padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:10;max-width:90%;text-align:center}
#toast.show{opacity:1}
.plan-input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;color:var(--txt);font:inherit;padding:12px;margin:6px 0 12px}
.plan-input:focus{outline:1px solid var(--acc)}
.plan-exercises{padding-left:24px;overflow-wrap:anywhere}
.plan-name{overflow-wrap:anywhere;color:var(--txt)!important}
</style>
</head>
<body>
<div id="app"></div>
<nav>
  <button id="n-day"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Today</button>
  <button id="n-list"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Days</button>
  <button id="n-ex"><svg viewBox="0 0 24 24"><path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/></svg>Exercises</button>
  <button id="n-bk"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg>Backup</button>
</nav>
<input type="file" id="file" accept=".json,application/json" hidden>
<div id="sheet"><div class="box">
  <h3>Report copied</h3>
  <pre id="rep"></pre>
  <button class="btn" id="cp">Copy report again</button>
  <button class="btn s" id="cl">Close</button>
</div></div>
<div id="toast"></div>
<script>
const K='fit.days.v1',KB='fit.lastBackup',KP='fit.plans.v1';
let plans=[];
try{plans=cleanPlans(JSON.parse(localStorage.getItem(KP)||'[]'))}catch(e){}
let db={};
try{db=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){db={}}
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmt(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return fmt(d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const filled=k=>db[k]&&Object.keys(db[k]).length>0;
let cur=today(),tab='day',weekEnd=today();

function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Could not save data')}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
const long=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const short=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const toTop=()=>{$('app').scrollTop=0};

const CARDS=[
 {t:'Body weight',big:1,r:[['weight','Morning weight','kg','decimal']]},
 {t:'Sleep',r:[['sh','Hours','h','numeric'],['sm','Minutes','min','numeric'],['ss','Sleep score','','numeric']]},
 {t:'Activity',r:[['steps','Steps','','numeric'],['act','Active calories','kcal','numeric'],['rest','Resting calories','kcal','numeric']]},
 {t:'Nutrition',r:[['kcal','Calories eaten','kcal','numeric'],['p','Protein','g','decimal'],['c','Carbohydrates','g','decimal'],['f','Fat','g','decimal']]}
];
const NUM=['weight','sh','sm','ss','steps','act','rest','kcal','p','c','f'];

function render(){
  $('n-day').classList.toggle('on',tab==='day');
  $('n-list').classList.toggle('on',tab==='list');
  $('n-bk').classList.toggle('on',tab==='bk');
  $('n-ex').classList.toggle('on',tab==='ex');
  $('app').innerHTML='<div class="wrap">'+(tab==='day'?dayView():tab==='list'?listView():tab==='ex'?exercisesView():backupView())+'</div>';
}

function dayView(){
  const d=db[cur]||{},isT=cur===today();
  let h=`<div class="top"><div><h1>${isT?'Today':short(cur)}</h1><div class="sub">${isT?long(cur):'Editing a past day'}</div></div><span class="pill ${d.done?'ok':''}">${d.done?'Completed':'In progress'}</span></div>`;
  h+=`<div class="dn"><button data-a="prev">‹ Previous day</button><button data-a="next" ${cur>=today()?'disabled':''}>Next day ›</button></div>`;
  for(const c of CARDS){
    h+=`<div class="card ${c.big?'big':''}"><h2>${c.t}</h2>`;
    for(const [k,l,u,m] of c.r){
      h+=`<div class="row">${c.big?'':`<label for="i-${k}">${l}</label>`}<div class="f"><input id="i-${k}" data-k="${k}" inputmode="${m}" autocomplete="off" placeholder="–" value="${d[k]!==undefined?esc(d[k]):''}">${u?`<span class="u">${u}</span>`:''}</div></div>`;
    }
    h+='</div>';
  }
  h+=`<div class="card"><h2>Notes</h2><textarea data-k="notes" placeholder="How did the day go?">${esc(d.notes||'')}</textarea></div>`;
  h+=d.done
    ?`<button class="btn" data-a="copy">Copy report</button><button class="btn s" data-a="reopen">Reopen day</button>`
    :`<button class="btn" data-a="close">Close day and copy report</button>`;
  return h;
}

function listView(){
  const ks=Array.from({length:7},(_,i)=>addDays(weekEnd,-i));
  let h=`<div class="top"><div><h1>Days</h1><div class="sub">Tap a day to view it or fill it in</div></div></div>`;
  h+=`<div class="dn"><button data-a="week-prev">‹ Previous week</button><button data-a="week-next" ${weekEnd>=today()?'disabled':''}>Next week ›</button></div><p class="hint">${short(addDays(weekEnd,-6))} – ${short(weekEnd)}</p>`;
  for(const k of ks){
    const d=db[k]||{},s=[],has=filled(k);
    if(d.weight)s.push(d.weight+' kg');
    if(d.kcal)s.push(d.kcal+' kcal');
    if(d.steps)s.push(d.steps+' steps');
    h+=`<button class="day" data-d="${k}"><div><b>${k===today()?'Today, ':''}${short(k)}</b><span class="m">${has?(s.join(', ')||'Notes only'):'No data yet'}</span></div><span class="pill ${d.done?'ok':''}">${d.done?'Completed':has?'In progress':'Empty'}</span></button>`;
  }
  return h;
}

function cleanPlans(value){
  if(!Array.isArray(value))return [];
  return value.filter(p=>p&&typeof p.name==='string'&&p.name.trim()&&Array.isArray(p.exercises))
    .map(p=>({name:p.name.trim(),exercises:p.exercises.filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim())}))
    .filter(p=>p.exercises.length);
}
function persistPlans(next){
  try{localStorage.setItem(KP,JSON.stringify(next));plans=next;return true}
  catch(e){toast('Could not save plans');return false}
}
function exercisesView(){
  let h=`<div class="top"><div><h1>Exercises</h1><div class="sub">Your training plans</div></div></div>
  <form id="plan-form" class="card"><h2>Add training plan</h2>
  <label for="plan-name">Plan name</label><input class="plan-input" id="plan-name" name="name" required maxlength="120" placeholder="e.g. Full body A">
  <label for="plan-exercises">Exercise names</label><p class="hint">Enter one exercise per line.</p>
  <textarea id="plan-exercises" name="exercises" required placeholder="Squat&#10;Bench press&#10;Row"></textarea>
  <button class="btn" type="submit">Add plan</button></form>`;
  if(!plans.length)h+='<p class="hint">No training plans yet. Add your first plan above.</p>';
  plans.forEach((p,i)=>{h+=`<div class="card"><h2 class="plan-name">${esc(p.name)}</h2><ol class="plan-exercises">${p.exercises.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol><button class="btn s" data-a="delete-plan" data-index="${i}">Delete plan</button></div>`});
  return h;
}

function backupView(){
  const n=Object.keys(db).filter(filled).length,lb=localStorage.getItem(KB);
  return `<div class="top"><div><h1>Backup</h1><div class="sub">Save your data to a file</div></div></div>
  <div class="card"><h2>Status</h2>
   <div class="row"><label>Days saved</label><b>${n}</b></div>
   <div class="row"><label>Training plans</label><b>${plans.length}</b></div>
   <div class="row"><label>Last backup</label><b>${lb?short(lb):'Never'}</b></div></div>
  <button class="btn" data-a="export">Export backup</button>
  <button class="btn s" data-a="import">Restore from file</button>
  <p class="hint">Export opens the iPhone share sheet. Choose Save to Files and keep the file somewhere safe, for example iCloud Drive. Restoring replaces all data currently in the app.</p>
  <details class="card"><summary>If export or restore fails, use text</summary>
   <textarea id="bt" placeholder="Paste backup text here to restore"></textarea>
   <button class="btn s" data-a="tcopy">Copy backup as text</button>
   <button class="btn s" data-a="trestore">Restore from pasted text</button></details>`;
}

function report(date){
  const d=db[date]||{},L=['PERSONAL FITNESS TRACKER — DAILY REPORT','','Date: '+date];
  const has=k=>d[k]!==undefined&&d[k]!==''&&!isNaN(Number(d[k]));
  const n=k=>String(Number(d[k]));
  const sec=(t,a)=>{a=a.filter(Boolean);if(a.length)L.push('',t,...a)};
  sec('BODY WEIGHT',[has('weight')&&'- Morning weight: '+n('weight')+' kg']);
  let dur=null;
  if(has('sh')||has('sm'))dur='- Duration: '+(has('sh')?n('sh'):0)+'h '+(has('sm')?n('sm'):0)+'m';
  sec('SLEEP',[dur,has('ss')&&'- Sleep score: '+n('ss')]);
  sec('ACTIVITY',[has('steps')&&'- Steps: '+Number(d.steps).toLocaleString('en-US'),has('act')&&'- Active calories burned: '+n('act')+' kcal',has('rest')&&'- Resting calories burned: '+n('rest')+' kcal']);
  sec('NUTRITION',[has('kcal')&&'- Calories consumed: '+n('kcal')+' kcal',has('p')&&'- Protein: '+n('p')+' g',has('c')&&'- Carbohydrates: '+n('c')+' g',has('f')&&'- Fat: '+n('f')+' g']);
  if(d.notes&&d.notes.trim())sec('NOTES',['- '+d.notes.trim()]);
  return L.join('\n');
}

async function copy(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}
}

async function doCopy(){
  const t=report(cur),ok=await copy(t);
  $('rep').textContent=t;
  document.querySelector('.box h3').textContent=ok?'Report copied':'Copy failed, select the text below';
  $('sheet').classList.add('show');
  if(ok)toast('Copied to clipboard');
}

/* ---------- backup ---------- */
const backupJson=()=>JSON.stringify({app:'fitness-tracker',version:2,exported:new Date().toISOString(),days:db,plans},null,1);
function markBackup(){localStorage.setItem(KB,today());if(tab==='bk')render();toast('Backup exported')}

async function exportBackup(){
  const json=backupJson(),name='fitness-backup-'+today()+'.json';
  try{
    const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});markBackup();return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);markBackup();
  }catch(e){const ok=await copy(json);toast(ok?'Export failed, backup copied as text instead':'Export failed')}
}

function clean(days){
  const out={};
  for(const [k,v] of Object.entries(days)){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!v||typeof v!=='object')continue;
    const d={};
    for(const f of NUM)if(v[f]!==undefined&&v[f]!==''&&!isNaN(Number(v[f])))d[f]=String(v[f]);
    if(typeof v.notes==='string'&&v.notes.trim())d.notes=v.notes;
    if(v.done)d.done=1;
    if(Object.keys(d).length)out[k]=d;
  }
  return out;
}

function restore(text){
  let o;try{o=JSON.parse(text)}catch(e){return toast('This is not a valid backup')}
  if(!o||o.app!=='fitness-tracker'||!o.days||typeof o.days!=='object')return toast('This is not a fitness tracker backup');
  const days=clean(o.days),n=Object.keys(days).length;
  const restoredPlans=o.plans===undefined?plans:cleanPlans(o.plans);
  if(!n&&!restoredPlans.length)return toast('This backup contains no data');
  const have=Object.keys(db).filter(filled).length;
  if(!confirm('Replace all data in the app ('+have+' days) with this backup ('+n+' days and '+restoredPlans.length+' training plans)? This cannot be undone.'))return;
  if(!persistPlans(restoredPlans))return;
  db=days;save();cur=today();tab='day';render();toast('Backup restored');
}

/* ---------- events ---------- */
document.addEventListener('submit',e=>{
  if(e.target.id!=='plan-form')return;
  e.preventDefault();
  const name=$('plan-name').value.trim(),exercises=$('plan-exercises').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!name||!exercises.length)return toast('Enter a plan name and at least one exercise');
  if(persistPlans([...plans,{name,exercises}])){render();toast('Training plan added')}
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  const d=db[cur]=db[cur]||{};
  const v=k==='notes'?e.target.value:e.target.value.replace(',','.').trim();
  if(v.trim()==='')delete d[k];else d[k]=v;
  if(!Object.keys(d).length)delete db[cur];
  save();
});

document.addEventListener('click',async e=>{
  const dd=e.target.closest('[data-d]');
  if(dd){cur=dd.dataset.d;tab='day';render();toTop();return}
  const a=e.target.closest('[data-a]');if(!a)return;
  const act=a.dataset.a;
  if(act==='week-prev'){weekEnd=addDays(weekEnd,-7);render();toTop();return}
  if(act==='week-next'){if(weekEnd<today()){weekEnd=addDays(weekEnd,7);render();toTop()}return}
  if(act==='delete-plan'){
    const i=Number(a.dataset.index);
    if(plans[i]&&confirm('Delete training plan "'+plans[i].name+'"?')){
      if(persistPlans(plans.filter((_,index)=>index!==i))){render();toast('Training plan deleted')}
    }
    return;
  }
  if(act==='export')return exportBackup();
  if(act==='import')return $('file').click();
  if(act==='tcopy'){const ok=await copy(backupJson());return toast(ok?'Backup copied as text':'Copy failed')}
  if(act==='trestore'){const t=$('bt').value.trim();return t?restore(t):toast('Paste the backup text first')}
  if(act==='prev'){cur=addDays(cur,-1);render();toTop()}
  else if(act==='next'){if(cur<today()){cur=addDays(cur,1);render();toTop()}}
  else if(act==='close'){const d=db[cur]=db[cur]||{};d.done=1;save();render();await doCopy()}
  else if(act==='copy')await doCopy();
  else if(act==='reopen'){delete db[cur].done;save();render()}
});

$('file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)restore(await f.text())};
$('n-day').onclick=()=>{cur=today();tab='day';render();toTop()};
$('n-list').onclick=()=>{weekEnd=today();tab='list';render();toTop()};
$('n-ex').onclick=()=>{tab='ex';render();toTop()};
$('n-bk').onclick=()=>{tab='bk';render();toTop()};
$('cp').onclick=async()=>{const ok=await copy($('rep').textContent);toast(ok?'Copied to clipboard':'Copy failed')};
$('cl').onclick=()=>$('sheet').classList.remove('show');
$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheet').classList.remove('show')};

if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
